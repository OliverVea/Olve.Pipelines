# In-repo CD pipeline for Olve.Pipelines (GitOps) — self-deploy.
#
# This file is the single source of truth for how this app is built and deployed.
# A pipeline is bound to this repo and the service reconciles the live pipeline to
# match this file on every change; pushing a commit deploys automatically (the
# deploy poll is configured by the binding — no trigger needs declaring here).
#
# Secrets are declared by NAME only; their values live in the pipeline's own k8s
# secret (olve-pipeline-{id}) and never in the repo. Steps reference them as
# ordinary env vars ($GITHUB_TOKEN, $SSH_PRIVATE_KEY) — they are mounted into
# every job.
#
# Beta deploys first and gates prod: if deploy-beta fails (build, rollout, or the
# post-deploy health check), the deploy (prod) step never runs.
apiVersion: "0.0"
name: olve-pipelines
description: Build with Kaniko, deploy to the homelab (beta then prod) with Helm.
version: "1"

secrets:
  - name: GITHUB_TOKEN
    description: GitHub read token used to fetch the repo tarball during build.
  - name: SSH_PRIVATE_KEY
    description: SSH key for importing the image and running helm on the homelab host.

# Production steps run in parallel and write to bundle/<step-name>/.
productionSteps:
  - name: build-and-package
    configuration:
      image: gcr.io/kaniko-project/executor:debug
      scriptFile: scripts/build.sh
  # Runs the code-only test suite in parallel with the build (not inside it). If tests
  # fail, the production job group fails and the deploy cascade never starts. This step
  # produces no deploy artifacts (no version.txt), so the deploy scripts ignore its
  # bundle dir by selecting the one that contains version.txt.
  - name: code-test
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
      scriptFile: scripts/test.sh

# Processing steps run sequentially (order = list position), each receiving the
# bundle. deploy-beta runs first and gates deploy (prod).
processingSteps:
  - name: deploy-beta
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy-beta.sh
  - name: deploy
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy.sh

# Failure handlers run as best-effort K8s Jobs when a job group fails. `aoe-triage` is a
# built-in library handler that opens an Agent of Empires session to investigate the failure.
# Omitting `steps:` makes it fire on ANY failure in this pipeline (build, test, or either deploy).
# It reaches aoe via the in-cluster Service (below the Authentik ingress), so no token is needed.
failureHandlers:
  - handler: aoe-triage
    env:
      AOE_BASE_URL: http://agent-of-empires.apps.svc.cluster.local:8080
      AOE_TOOL: claude
      AOE_REPO_PATH: /home/oliver/projects/Olve.Pipelines
      AOE_PROMPT_TEMPLATE: >-
        The Olve.Pipelines CD pipeline '$PIPELINE_NAME' failed at step
        '$PIPELINE_FAILED_STEP' ($PIPELINE_FAILED_STEP_KIND): $PIPELINE_FAILURE_REASON.
        The failed job's logs are in S3 at key '$PIPELINE_LOG_KEY' (pipeline id $PIPELINE_ID).
        Investigate the root cause and propose or apply a fix on a new branch.
