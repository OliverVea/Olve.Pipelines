# In-repo CD pipeline for Olve.Pipelines v2 (GitOps) — v2 branch, beta only.
#
# This is the v1-format config that deploys the v2 instance while v2 is under development:
# a pipeline on the v1 prod instance is bound to the `v2` branch and reconciles from this
# file. It builds the v2 branch and deploys a separate Helm release (olve-pipelines-v2) into
# apps-beta, next to the v1 beta release. There is no prod step and no CLI publish — those
# stay on main's config until v2 replaces v1 (docs/design/pipelines-v2.md §13).
#
# Secrets are declared by NAME only; their values live in the pipeline's own k8s secret
# (olve-pipeline-{id}), copied from the v1 Olve.Pipelines pipeline.
apiVersion: "0.0"
name: Olve.Pipelines v2
description: Build the v2 branch with Kaniko and deploy it to apps-beta (olve-pipelines-v2) with Helm.
version: "1"

secrets:
  - name: GITHUB_TOKEN
    description: GitHub read token used to fetch the repo tarball during build.
  - name: SSH_PRIVATE_KEY
    description: SSH key for importing the image and running helm on the homelab host.

# Production steps run in parallel and write to bundle/<step-name>/.
productionSteps:
  - name: build-and-package
    configuration:
      image: gcr.io/kaniko-project/executor:debug
      scriptFile: scripts/build.sh
  - name: code-test
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
      scriptFile: scripts/test.sh

processingSteps:
  - name: deploy-beta
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy-beta.sh
