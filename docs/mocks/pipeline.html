<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Olve Pipelines — Pipeline</title>
  <meta name="theme-color" content="#f5f8fb" />
  <link rel="stylesheet" href="mocks.css" />
  <link rel="stylesheet" href="pipeline.css" />
</head>
<body class="anim-cascade">
  <div class="app">
    <!-- ===== App header ===== -->
    <header class="app-header animate-in" style="--i: 0">
      <h1><a href="index.html">Olve Pipelines</a></h1>
      <span class="spacer"></span>
      <div class="user-info">
        <span class="user-name">oliver</span>
        <button class="btn">Log out</button>
      </div>
    </header>

    <main>
      <div class="detail-head animate-in" style="--i: 1">
        <a class="back" href="index.html">&larr; Back</a>
        <h2 id="title">Pipeline</h2>
        <button class="icon-btn" id="reload" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>

      <!-- GitOps binding bar (omitted entirely for unbound drafts) -->
      <div class="binding-bar animate-in" id="binding" style="--i: 2"></div>

      <!-- Horizontal flow diagram -->
      <div class="flow-scroll animate-in" style="--i: 3">
        <div class="flow" id="flow"></div>
      </div>
    </main>
  </div>

  <script>
    // ====================================================================
    // Demo data — keyed by ?id=. Each pipeline has production steps (parallel),
    // an artifact bundle, and processing steps (sequential), plus a GitOps
    // binding state. This mirrors index.html's RUN MODEL (keep the two telling
    // the same story per id):
    //
    //   • A *run* is a numbered build of the whole pipeline tied to a commit.
    //     Numbering is NEWEST-FIRST: #1 = latest, higher = older.
    //   • Each step records the run it LAST executed (`lastRun`) and its
    //     `result` in that run (mirrors step-node.ts: scheduled | running |
    //     done | failed | cancelled | obsolete). A step that has never run has
    //     `lastRun: null` (a brand-new step) — the only "idle" case.
    //
    // PROMOTION STATE (this screen's feature): every PROCESSING step carries an
    // `enabled` flag — the gate that lets the artifact bundle promote INTO that
    // step. This is operational STATE, not GitOps config: it is UI/API-mutable
    // and present even on a bound pipeline (config is git-owned; operations like
    // enable/disable + re-promote are API-allowed). `enabled` is ORTHOGONAL to
    // the step's last job result — a step can be `done` AND have its promotion
    // disabled. Production steps have no promotion gate.
    // ====================================================================
    const PIPELINES = {
      'p-self': {
        name: 'olve-pipelines (self-deploy)',
        binding: { repo: 'github.com/OliverVea/Olve.Pipelines', branch: 'main', result: 'ok' },
        runs: [
          { n: 1, sha: '19b1b3f0', outcome: 'in-progress' },
          { n: 2, sha: '1cd6a652', outcome: 'succeeded' },
          { n: 3, sha: '6a2ea6cd', outcome: 'failed' },
        ],
        // Production is mid-run #1; processing last completed in run #2.
        production: [
          { name: 'build', lastRun: 1, result: 'done' },
          { name: 'test', lastRun: 1, result: 'done' },
          { name: 'docker', lastRun: 1, result: 'running' },
        ],
        processing: [
          { name: 'push-image', lastRun: 2, result: 'done', enabled: true },
          // Promotion into helm-deploy is BLOCKED — the image was pushed, but
          // the operator is holding the deploy. Step still shows its last
          // result (done #2); the block is a separate, orthogonal fact.
          { name: 'helm-deploy', lastRun: 2, result: 'done', enabled: false },
        ],
      },
      'p-site': {
        name: 'ovea.pro static site',
        binding: { repo: 'github.com/OliverVea/ovea.pro', branch: 'main', result: 'ok' },
        runs: [{ n: 1, sha: 'aa12cd34', outcome: 'succeeded' }],
        production: [{ name: 'hugo-build', lastRun: 1, result: 'done' }],
        // Promotion to S3 sync is DISABLED — the build ran, but the operator
        // paused promotion (e.g. holding the site). Step still shows its last
        // result (done #1); the gate is a separate, disabled fact.
        processing: [{ name: 'sync-s3', lastRun: 1, result: 'done', enabled: false }],
      },
      'p-api': {
        name: 'inventory-api',
        binding: {
          repo: 'github.com/OliverVea/inventory-api', branch: 'main',
          result: 'error', problem: 'config.yaml: step "deploy" references unknown secret REGISTRY_TOKEN',
          unsetSecrets: ['REGISTRY_TOKEN'],
        },
        runs: [
          { n: 1, sha: 'c0ffee11', outcome: 'failed' },
          { n: 2, sha: 'deadbe22', outcome: 'succeeded' },
        ],
        // Run #1 broke at tests, so deploy never ran in #1 — it still shows its
        // last good run, #2.
        production: [
          { name: 'dotnet-build', lastRun: 1, result: 'done' },
          { name: 'unit-tests', lastRun: 1, result: 'failed' },
        ],
        processing: [{ name: 'deploy-staging', lastRun: 2, result: 'done', enabled: true }],
      },
      'p-draft': {
        name: 'experiment-sandbox',
        binding: null, // unbound draft — no GitOps bar
        runs: [],
        production: [],
        processing: [],
      },
    };

    /** Look up a run by its number (mirrors index.html). */
    function runByNumber(p, n) {
      return p.runs.find((r) => r.n === n) || null;
    }

    const id = new URLSearchParams(location.search).get('id') || 'p-self';
    const p = PIPELINES[id] || PIPELINES['p-self'];
    document.getElementById('title').textContent = p.name;
    document.title = 'Olve Pipelines — ' + p.name;

    // ---- Binding bar ----
    (function renderBinding() {
      const bar = document.getElementById('binding');
      const b = p.binding;
      if (!b) { bar.remove(); return; } // unbound draft

      const repo = document.createElement('span');
      repo.className = 'pill';
      repo.title = 'GitOps source — configuration is git-only';
      repo.innerHTML = b.repo + (b.branch ? ' <span class="branch">@' + b.branch + '</span>' : '');
      bar.appendChild(repo);

      const sync = document.createElement('span');
      if (b.result === 'error') {
        sync.className = 'pill error';
        sync.textContent = '⚠ reconcile error' + (b.problem ? ': ' + b.problem : '');
        sync.title = b.problem || '';
      } else if (b.result === 'ok') {
        sync.className = 'pill ok';
        sync.textContent = '✓ config synced';
      } else {
        sync.className = 'pill';
        sync.textContent = 'pending first sync';
      }
      bar.appendChild(sync);

      if (b.unsetSecrets && b.unsetSecrets.length) {
        const sec = document.createElement('span');
        sec.className = 'pill warn';
        sec.title = 'Set these via the secrets API or kubectl';
        sec.textContent = '⚠ unset secrets: ' + b.unsetSecrets.join(', ');
        bar.appendChild(sec);
      }
    })();

    // ---- Flow diagram ----
    // SVG glyph builders for the arrow badges.
    function svgIcon(paths) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
        'aria-hidden="true">' + paths + '</svg>';
    }
    const ICON_BRAKE = svgIcon('<circle cx="12" cy="12" r="9" /><line x1="8" y1="8" x2="16" y2="16" />');
    const ICON_RESTART = svgIcon('<path d="M21 12a9 9 0 1 1-3-6.7" /><polyline points="21 3 21 9 15 9" />');

    /** A plain production→bundle connector (no promotion controls). */
    function connector() {
      const c = document.createElement('div');
      c.className = 'connector';
      c.innerHTML =
        '<svg viewBox="0 0 48 24"><line x1="0" y1="12" x2="38" y2="12" />' +
        '<polygon points="38,6 48,12 38,18" /></svg>';
      return c;
    }

    /** The connector INTO a processing step — the promotion arrow. Carries two
     *  icon badges: a BRAKE (block/unblock promotion, on = blocked) and a
     *  RESTART (re-promote, redrive the same bundle). Both are mock stubs.
     *  When promotion is off the arrow is dashed/dimmed; re-promote is hidden
     *  on a never-run step (nothing to redrive). */
    function promotionConnector(step) {
      const off = step.enabled === false;

      const c = document.createElement('div');
      c.className = 'connector promotion-arrow' + (off ? ' gated' : '');
      c.innerHTML =
        '<svg viewBox="0 0 48 24"><line x1="0" y1="12" x2="38" y2="12" />' +
        '<polygon points="38,6 48,12 38,18" /></svg>';

      const badges = document.createElement('div');
      badges.className = 'arrow-badges';

      // Brake: blocks promotion. "on" (active) when promotion is currently off.
      const brake = document.createElement('button');
      brake.type = 'button';
      brake.className = 'arrow-badge brake' + (off ? ' on' : '');
      brake.title = off
        ? 'Promotion blocked — click to allow the bundle to promote into ' + step.name
        : 'Block promotion into ' + step.name;
      brake.setAttribute('aria-pressed', String(off));
      brake.innerHTML = ICON_BRAKE;
      brake.addEventListener('click', () =>
        alert('→ ' + (off ? 'allow' : 'block') + ' promotion: ' + step.name));
      badges.appendChild(brake);

      // Re-promote: redrive the same bundle. Only where a bundle exists.
      if (step.lastRun != null) {
        const repromote = document.createElement('button');
        repromote.type = 'button';
        repromote.className = 'arrow-badge repromote';
        repromote.disabled = off;
        repromote.title = off
          ? 'Unblock promotion to re-promote'
          : 'Re-promote ' + step.name + ' with its last bundle (run #' + step.lastRun + ')';
        repromote.innerHTML = ICON_RESTART;
        repromote.addEventListener('click', () =>
          alert('→ re-promote ' + step.name + ' with bundle from run #' + step.lastRun));
        badges.appendChild(repromote);
      }

      c.appendChild(badges);
      return c;
    }

    function stepNode(step, type) {
      // A never-run step has no last result → render as idle.
      const status = step.lastRun == null ? 'idle' : step.result;

      const node = document.createElement('div');
      node.className = 'node';

      const header = document.createElement('div');
      header.className = 'node-header';

      const name = document.createElement('span');
      name.className = 'step-name';
      name.textContent = step.name;

      const label = {
        idle: 'Idle', scheduled: 'Scheduled', running: 'Running', done: 'Done',
        failed: 'Failed', cancelled: 'Cancelled', obsolete: 'Obsolete',
      }[status] || status;

      // Finished jobs link to their run's logs; live/idle ones show a plain
      // badge. Carry the run number so logs can resolve the commit later.
      const hasLogs = ['done', 'failed', 'cancelled', 'obsolete'].includes(status);
      let badge;
      if (hasLogs) {
        // The status badge opens the step-detail page (config, run history,
        // promotion controls, log tail). step.html owns its own data by id+step.
        badge = document.createElement('a');
        const q = new URLSearchParams({ id, step: step.name });
        badge.href = 'step.html?' + q.toString();
        badge.title = 'Step details';
      } else {
        badge = document.createElement('span');
      }
      badge.className = 'status-badge ' + status;
      badge.textContent = label;

      header.append(name, badge);
      node.appendChild(header);

      // Which run this step last executed (ties back to index.html's numbers).
      if (step.lastRun != null) {
        const run = runByNumber(p, step.lastRun);
        const detail = document.createElement('div');
        detail.className = 'node-detail';
        detail.textContent = 'run #' + step.lastRun + (run ? ' · ' + run.sha.slice(0, 7) : '');
        node.appendChild(detail);
      }

      return node;
    }

    (function renderFlow() {
      const flow = document.getElementById('flow');

      // Production column (parallel, stacked).
      const prod = document.createElement('div');
      prod.className = 'column';
      const prodLabel = document.createElement('div');
      prodLabel.className = 'column-label';
      prodLabel.textContent = 'Production';
      prod.appendChild(prodLabel);
      if (p.production.length) {
        p.production.forEach((s) => prod.appendChild(stepNode(s, 'production')));
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No steps';
        prod.appendChild(empty);
      }
      flow.appendChild(prod);

      flow.appendChild(connector());

      // Artifact bundle node.
      const bundle = document.createElement('div');
      bundle.className = 'bundle-node';
      bundle.innerHTML = '<div class="bundle-dot"></div><div class="bundle-label">Artifact<br>bundle</div>';
      flow.appendChild(bundle);

      // Processing columns (sequential).
      if (p.processing.length) {
        p.processing.forEach((s, i) => {
          // The connector INTO a processing step is the promotion arrow:
          // it carries the brake + re-promote badges.
          flow.appendChild(promotionConnector(s));
          const col = document.createElement('div');
          col.className = 'column';
          const label = document.createElement('div');
          label.className = 'column-label';
          label.innerHTML = i === 0 ? 'Processing' : '&nbsp;';
          col.appendChild(label);
          col.appendChild(stepNode(s, 'processing'));
          flow.appendChild(col);
        });
      } else {
        flow.appendChild(connector());
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No processing steps';
        flow.appendChild(empty);
      }
    })();

    document.getElementById('reload').addEventListener('click', (e) => {
      const svg = e.currentTarget.querySelector('svg');
      svg.classList.add('spin');
      setTimeout(() => svg.classList.remove('spin'), 800);
    });
  </script>
  <script src="footer.js" defer></script>
</body>
</html>
