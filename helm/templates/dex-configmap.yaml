{{- if .Values.dex.enabled }}
{{- if not .Values.dex.issuer }}
{{- fail "dex.enabled needs dex.issuer (https://<host>/dex)" }}
{{- end }}
{{- $u := urlParse .Values.dex.issuer }}
{{- $origin := printf "%s://%s" $u.scheme $u.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dex
  labels:
    app: {{ .Release.Name }}-dex
data:
  config.yaml: |
    issuer: {{ .Values.dex.issuer }}
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:5556
      allowedOrigins: [{{ $origin | quote }}]
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          redirectURI: {{ .Values.dex.issuer }}/callback
    staticClients:
      # The web UI and pl. With redirectURIs listed, Dex accepts only those: the device flow's
      # callback and pl's loopback ports (LoginCommand.LoopbackPorts) are listed too.
      - id: {{ .Values.dex.clientId }}
        name: Olve.Pipelines
        public: true
        redirectURIs:
          - {{ printf "%s/callback" $origin | quote }}
          - /device/callback
          {{- range list 48650 48651 48652 48653 48654 }}
          - {{ printf "http://127.0.0.1:%d/callback" . | quote }}
          {{- end }}
{{- end }}
