{{- if .Values.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-data
  labels:
    app: {{ .Release.Name }}-minio
  annotations:
    # Precious data volume: survive `helm uninstall` (and never get adopted/deleted on upgrade).
    # `pl teardown` deletes it explicitly only on --purge-data.
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.minio.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
{{- end }}
