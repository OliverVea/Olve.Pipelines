config:
  Auth__Authority: "https://auth-beta.ovea.pro/application/o/olve-pipelines/"
  Auth__Audience: "olve-pipelines-beta"
  Auth__FrontendAuthority: "https://auth-beta.ovea.pro/application/o/olve-pipelines-frontend/"
  Auth__FrontendAudience: "olve-pipelines-frontend-beta"
  OpenTelemetry__Endpoint: "http://otel-beta.ovea.pro"
  OpenTelemetry__Protocol: "http"
  OpenTelemetry__OAuth2__TokenUrl: ""
  OpenTelemetry__OAuth2__ClientId: ""
  # Dedicated in-cluster MinIO (this instance's own), reached cross-namespace by the
  # runner Jobs in olve-runners-beta. Static creds (below) take precedence over STS.
  Storage__Endpoint: "http://olve-pipelines-minio.apps-beta:9000"
  Storage__Bucket: "olve-pipelines-beta"
  # AuthUrl/ClientId/ClientSecret are still required: KubernetesConfiguration reuses
  # them for OpenBao auth to reach the cluster. They are now inert for storage.
  Storage__AuthUrl: "https://auth-beta.ovea.pro/application/o/token/"
  Kubernetes__OpenBaoUrl: "https://openbao-beta.ovea.pro"
  Kubernetes__Namespace: "olve-runners-beta"
  # GitHub webhook auto-registration target (beta-first rollout). Must match ingress.public.host.
  Webhooks__PublicBaseUrl: "https://pipelines-hooks-beta.ovea.pro"

secrets:
  - name: olve-pipelines-oidc
    envMap:
      Storage__ClientId: client-id
      Storage__ClientSecret: client-secret
      Storage__RoleArn: role-arn
  # Static MinIO creds (root = app creds for now). Created out-of-band; see
  # docs/operations/environment-setup.md.
  - name: olve-pipelines-minio
    envMap:
      Storage__AccessKey: root-user
      Storage__SecretKey: root-password

minio:
  enabled: true
  bucket: olve-pipelines-beta

authentikCa:
  fileName: auth-beta-ca.crt

# Beta ingress (private pipelines-beta.ovea.pro + public pipelines-hooks-beta.ovea.pro) is
# owned by the Olve.Homelab edge chart (its values-beta.yaml). Explicitly disabled here —
# base values.yaml already defaults both off, but this overlay must not re-enable public —
# so the app's beta Helm release and the edge release don't fight over the objects.
# Webhooks__PublicBaseUrl above stays: it only configures GitHub webhook auto-registration,
# independent of who owns the ingress.
ingress:
  enabled: false
  public:
    enabled: false
