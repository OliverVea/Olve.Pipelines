# Beta overlay, layered after values-beta.yaml (the pipeline's deploy-beta step). Release
# olve-pipelines-v2 in apps-beta; runners in olve-runners-beta.
config:
  # This release's own Garage (olve-pipelines-v2-garage).
  Storage__Endpoint: "http://olve-pipelines-v2-garage.apps-beta:3900"
  # Host step pods dial for pre-signed URLs (signed into SigV4). The FQDN is what the harness
  # validation ran against (harness/README.md); the short form above relies on search domains.
  Storage__InClusterEndpoint: "http://olve-pipelines-v2-garage.apps-beta.svc.cluster.local:3900"
  Storage__Bucket: "olve-pipelines-v2-beta"
  # Public webhook host (Cloudflare tunnel, routes only /api/webhooks/binding and /api/hooks).
  Webhooks__PublicBaseUrl: "https://pipelines-hooks-beta.ovea.pro"
  # Base of the run/log links in a failure handler's FailureContext.
  Links__BaseUrl: "https://pipelines-beta.ovea.pro"
  # Beta only: reads without a session, for beta-test's smoke check and the dev server's auth bypass.
  Auth__AnonymousReads: "true"
  # Beta keeps little: a run goes once it is older than 14 days and outside its pipeline's latest 3
  # (~55 MB per self-deploy run would fill the 20Gi Garage in weeks under the 183-day default).
  Retention__DryRun: "false"
  Retention__MinRunAgeDays: "14"
  Retention__KeepLatestRuns: "3"
  # The controller reaches the cluster with its own ServiceAccount, not an OpenBao token.
  Kubernetes__AuthMode: "InCluster"
  Kubernetes__OpenBaoUrl: ""
  Storage__AuthUrl: ""

serviceAccount:
  enabled: true

# Only the Garage credentials; the OpenBao client Secret isn't needed with InCluster.
secrets:
  - name: olve-pipelines-minio
    envMap:
      Storage__AccessKey: root-user
      Storage__SecretKey: root-password

authentikCa:
  enabled: false

# Reuses the beta credentials Secret by reference — each Garage keeps its own metadata, so
# sharing the access key is harmless.
garage:
  enabled: true
  bucket: olve-pipelines-v2-beta
  dataStorage: 20Gi

dex:
  enabled: true
  issuer: https://pipelines-beta.ovea.pro/dex
