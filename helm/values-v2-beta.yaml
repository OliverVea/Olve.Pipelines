# v2 beta overlay, layered after values-beta.yaml (deploy-beta.sh on the v2 branch). Deployed
# as its own release (olve-pipelines-v2) in apps-beta beside v1 beta; every chart resource is
# release-scoped, so only the storage wiring and webhook registration differ here. Auth, OIDC
# (OpenBao cluster access) and the runner namespace (olve-runners-beta) are shared with v1
# beta — v1 never lists or sweeps Jobs it did not create, so the two don't interfere.
config:
  # This release's own Garage (olve-pipelines-v2-garage), not v1 beta's.
  Storage__Endpoint: "http://olve-pipelines-v2-garage.apps-beta:3900"
  # Host step pods dial for pre-signed URLs (signed into SigV4). The FQDN is what the harness
  # validation ran against (harness/README.md); the short form above relies on search domains.
  Storage__InClusterEndpoint: "http://olve-pipelines-v2-garage.apps-beta.svc.cluster.local:3900"
  Storage__Bucket: "olve-pipelines-v2-beta"
  # No GitHub webhook auto-registration yet: v2 has no public route.
  Webhooks__PublicBaseUrl: ""
  # Base of the run/log links in a failure handler's FailureContext.
  Links__BaseUrl: "https://pipelines-v2-beta.ovea.pro"
  # Beta keeps little: a run goes once it is older than 14 days and outside its pipeline's latest 3
  # (~55 MB per self-deploy run would fill the 20Gi Garage in weeks under the 183-day default).
  Retention__DryRun: "false"
  Retention__MinRunAgeDays: "14"
  Retention__KeepLatestRuns: "3"
  # /download serves the pl binaries of this pipeline's latest successful publish-cli attempt (the
  # self-deploy's own .pipelines/pipeline.ts); retention keeps that run whatever its age or rank.
  Distribution__CliPipeline: "Olve.Pipelines v2"

# MinIO is archived (images 401); v2 never had one.
minio:
  enabled: false

# Reuses the beta credentials Secret by reference — each Garage keeps its own metadata, so
# sharing the access key is harmless.
garage:
  enabled: true
  bucket: olve-pipelines-v2-beta
  dataStorage: 20Gi
