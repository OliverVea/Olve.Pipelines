# v2 prod overlay, layered after values.yaml (v1 prod's defaults). Its own release
# (olve-pipelines-v2) in apps beside v1 prod; every chart resource is release-scoped. Auth, OIDC,
# OpenBao and the runner namespace (olve-runners) are shared with v1 prod, whose Jobs v2 never
# sweeps (retention only touches Jobs labelled with a v2 role and one of this instance's pipelines).
config:
  Storage__Endpoint: "http://olve-pipelines-v2-garage.apps:3900"
  # Host step pods dial for pre-signed URLs (signed into SigV4).
  Storage__InClusterEndpoint: "http://olve-pipelines-v2-garage.apps.svc.cluster.local:3900"
  Storage__Bucket: "olve-pipelines-v2"
  # Empty = no GitHub webhook auto-registration; the inherited value is v1 prod's hook host.
  Webhooks__PublicBaseUrl: ""
  Links__BaseUrl: "https://pipelines-v2-private.ovea.pro"
  Telemetry__ServiceName: "olve-pipelines-v2"
  Distribution__CliPipeline: "Olve.Pipelines v2"

# The credentials Secret (olve-pipelines-minio) is shared with v1 prod's Garage; each Garage keeps
# its own metadata, and --default-bucket creates this bucket and key on first boot.
garage:
  enabled: true
  bucket: olve-pipelines-v2
  dataStorage: 100Gi

# No sloth CRD on the cluster.
slo:
  enabled: false
