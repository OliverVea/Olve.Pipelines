replicaCount: 1

image:
  repository: ghcr.io/olivervea/olve-pipelines
  tag: latest
  # Pins the image (repository:tag@digest); empty = by tag.
  digest: ""
  pullPolicy: IfNotPresent

# How users authenticate, mapped onto config.Auth__*. Empty = config.Auth__* as given.
#   mode: none                     # Auth__Disable=true: every endpoint is anonymous
#   mode: dex, issuer, clientId, frontendClientId?, anonymousReads?
#   mode: authentik, authority, audience, frontendAuthority, frontendAudience, anonymousReads?
# Required, here or as config.Auth__*: the chart refuses to render without auth.
auth: {}

# Telemetry export, mapped onto config.OpenTelemetry__*. Empty = config.OpenTelemetry__* as given.
#   exporter: none
#   exporter: otlp, endpoint, protocol?, headers?: { kubernetesSecret: { name, key } }
#     (headers: a Secret key holding "k1=v1,k2=v2", e.g. a backend's API key)
telemetry: {}

# The controller's ServiceAccount, with rights in the runner namespace (config.Kubernetes__Namespace).
serviceAccount:
  enabled: true

# The step pods' init image (harness/base), rendered as Harness__HarnessBaseImage. The deploy sets it
# from the publish-harness step's pushed image; empty = the server's built-in default.
harness:
  image:
    repository: ""
    tag: ""
    digest: ""

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

# Ingress (private + public) is OWNED BY THE Olve.Homelab EDGE CHART, not this chart —
# both the prod and beta homelab deploys route to this Service from there (its
# values-{prod,beta}.yaml). Both flags default off so this app's own Helm release never
# renders an Ingress and the two releases can't fight over the same object. The templates
# (ingress-{private,public}.yaml) and all the fields below are kept so a standalone
# install that is NOT behind the edge chart can opt back in with ingress.enabled=true /
# ingress.public.enabled=true. (pl bootstrap's minimal profile keeps both off.)
ingress:
  enabled: false
  host: pipelines-private.ovea.pro
  externalDnsTarget: "100.100.117.17"
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""
  annotations: {}
  # Internet-facing ingress exposing ONLY /api/webhooks/binding (the inbound GitHub push webhook). Disabled by default: the private ingress above targets a Tailscale IP that
  # GitHub cannot reach. When enabled, also set config.Webhooks__PublicBaseUrl below so
  # auto-registered hooks point at this host. Must be fronted by a real public entrypoint
  # (Cloudflare Tunnel or a public ingress controller).
  public:
    enabled: false
    host: pipelines-hooks.ovea.pro
    # Publish a Cloudflare-proxied CNAME to the tunnel (same as the questionbank prod
    # ingress) so GitHub reaches the receiver via Cloudflare→tunnel→Traefik. An empty
    # target makes ExternalDNS publish the Traefik LB's private IP, which GitHub can't
    # reach (502). The tunnel UUID matches infra/cloudflared in the homelab repo.
    externalDnsTarget: "44a106ce-fecc-4ff0-abed-ea64dfbb8703.cfargotunnel.com"
    clusterIssuer: letsencrypt-prod
    ingressClassName: ""
    tls:
      enabled: true
      secretName: ""
    annotations:
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    # 256Mi ran out (OutOfMemoryException, 502s, failed saves) when every binding resumed at
    # once after an expired GitHub token was replaced. Headroom, not a fix: memory grows with
    # job events until restart (#26).
    memory: 512Mi

# Dedicated in-cluster Garage (S3-compatible). Runs
# single-node; the access key + bucket are created at startup from the credentials Secret
# (keys: root-user, root-password, rpc-secret). Metadata on SSD, object data on the bulk HDD.
# See docs/superpowers/specs/2026-09-26-garage-storage-design.md.
garage:
  enabled: true
  image: "dxflrs/garage:v2.4.1"
  credentialsSecret: olve-pipelines-minio
  bucket: olve-pipelines
  metaStorage: 5Gi
  metaStorageClass: local-path
  dataStorage: 500Gi
  dataStorageClass: bulk
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bundled Dex (OIDC with a GitHub upstream), served under /dex on the instance's host: the edge
# routes <host>/dex to the <release>-dex Service. GitHub app credentials come from githubSecret
# (keys github-client-id, github-client-secret).
dex:
  enabled: false
  image: "dexidp/dex:v2.43.1"
  issuer: ""
  clientId: olve-pipelines
  githubSecret: olve-pipelines-dex
  storage: 1Gi
  storageClass: local-path
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  # Emit structured JSON log lines to stdout via the framework's native console formatter (zero
  # app code) so the node's OTel Collector can scrape them into queryable fields. Local dev omits
  # this and falls back to the pretty 'simple' formatter. Beta inherits both keys from this base
  # values file (its values-beta.yaml overlay only overrides env-specific config).
  Logging__Console__FormatterName: "json"
  Logging__Console__Json__UseUtcTimestamp: "true"
  # Dedicated in-cluster Garage (this instance's own), reached cross-namespace by the
  # runner Jobs in olve-runners, with the static credentials below.
  Storage__Endpoint: "http://olve-pipelines-garage.apps:3900"
  Storage__Bucket: "olve-pipelines"
  # The controller's ServiceAccount reaches the cluster API.
  Kubernetes__AuthMode: "InCluster"
  Kubernetes__Namespace: "olve-runners"
  # Run step/failure-handler pods under gVisor (RuntimeClass owned by the Olve.Homelab
  # chart; runsc installed on the node). Clear to fall back to plain runc.
  Kubernetes__RuntimeClassName: "gvisor"
  # Externally-reachable origin GitHub posts webhook deliveries to. Empty = GitHub webhook
  # auto-registration disabled (the receiver still serves manually-created hooks). Set this
  # together with ingress.public.enabled=true to enable auto-registration.
  Webhooks__PublicBaseUrl: "https://pipelines-hooks.ovea.pro"

secrets:
  # Static Garage creds (root = app creds for now; the Secret name predates Garage). Created out-of-band; see
  # docs/operations/environment-setup.md.
  - name: olve-pipelines-minio
    envMap:
      Storage__AccessKey: root-user
      Storage__SecretKey: root-password

slo:
  enabled: true
  labels:
    owner: "oliver"
    tier: "2"
  objectives:
    availability:
      target: 99.9
      description: "HTTP requests should not return 5xx errors."
    latency:
      target: 99
      threshold: "0.5"
      description: "HTTP requests should complete within 500ms."
