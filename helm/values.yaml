replicaCount: 1

image:
  repository: olve-pipelines
  tag: latest
  pullPolicy: IfNotPresent

# ServiceAccount + RBAC for in-cluster controller→K8s access (Tier-A / InCluster auth
# mode). Off here: the full/prod profile reaches the cluster via OpenBao (see
# Kubernetes__AuthMode below). pl install's minimal profile flips this on.
serviceAccount:
  enabled: false

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

ingress:
  enabled: true
  host: pipelines-private.ovea.pro
  externalDnsTarget: "100.100.117.17"
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""
  annotations: {}
  # Internet-facing ingress exposing ONLY /api/webhooks/github (the inbound GitHub webhook
  # receiver). Disabled by default: the private ingress above targets a Tailscale IP that
  # GitHub cannot reach. When enabled, also set config.Webhooks__PublicBaseUrl below so
  # auto-registered hooks point at this host. Must be fronted by a real public entrypoint
  # (Cloudflare Tunnel or a public ingress controller).
  public:
    enabled: true
    host: pipelines-hooks.ovea.pro
    # Publish a Cloudflare-proxied CNAME to the tunnel (same as the questionbank prod
    # ingress) so GitHub reaches the receiver via Cloudflare→tunnel→Traefik. An empty
    # target makes ExternalDNS publish the Traefik LB's private IP, which GitHub can't
    # reach (502). The tunnel UUID matches infra/cloudflared in the homelab repo.
    externalDnsTarget: "44a106ce-fecc-4ff0-abed-ea64dfbb8703.cfargotunnel.com"
    clusterIssuer: letsencrypt-prod
    ingressClassName: ""
    tls:
      enabled: true
      secretName: ""
    annotations:
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Dedicated in-cluster MinIO for this instance's storage (snapshots + bundles).
# Disabled by default; enabled per-environment (beta first). When enabled, point the
# controller at it via Storage__Endpoint + static creds (see values-beta.yaml). The
# credentials Secret (keys: root-user, root-password) is created out-of-band —
# see docs/operations/environment-setup.md.
minio:
  enabled: true
  image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
  credentialsSecret: olve-pipelines-minio
  bucket: olve-pipelines
  storage: 10Gi
  storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Auth__Authority: "https://auth.ovea.pro/application/o/olve-pipelines/"
  Auth__Audience: "olve-pipelines"
  OpenTelemetry__Endpoint: "https://otel.ovea.pro"
  OpenTelemetry__Protocol: "http"
  OpenTelemetry__OAuth2__TokenUrl: "https://auth.ovea.pro/application/o/token/"
  OpenTelemetry__OAuth2__ClientId: "otel"
  # Dedicated in-cluster MinIO (this instance's own), reached cross-namespace by the
  # runner Jobs in olve-runners. Static creds (below) take precedence over STS.
  Storage__Endpoint: "http://olve-pipelines-minio.apps:9000"
  Storage__Bucket: "olve-pipelines"
  # AuthUrl/ClientId/ClientSecret are still required: KubernetesConfiguration reuses
  # them for OpenBao auth to reach the cluster. They are now inert for storage.
  Storage__AuthUrl: "https://auth.ovea.pro/application/o/token/"
  # Cluster access for the controller: OpenBao (legacy, this profile) vs InCluster
  # (ServiceAccount token, used by pl install's minimal profile). Explicit here so a
  # future code-side default change can't silently switch prod.
  Kubernetes__AuthMode: "OpenBao"
  Kubernetes__OpenBaoUrl: "https://openbao.ovea.pro"
  Kubernetes__Namespace: "olve-runners"
  # Externally-reachable origin GitHub posts webhook deliveries to. Empty = GitHub webhook
  # auto-registration disabled (the receiver still serves manually-created hooks). Set this
  # together with ingress.public.enabled=true to enable auto-registration.
  Webhooks__PublicBaseUrl: "https://pipelines-hooks.ovea.pro"

secrets:
  - name: authentik-oidc-secrets
    envMap:
      OpenTelemetry__OAuth2__ClientSecret: otel-client-secret
  - name: olve-pipelines-oidc
    envMap:
      Storage__ClientId: client-id
      Storage__ClientSecret: client-secret
      Storage__RoleArn: role-arn
  # Static MinIO creds (root = app creds for now). Created out-of-band; see
  # docs/operations/environment-setup.md.
  - name: olve-pipelines-minio
    envMap:
      Storage__AccessKey: root-user
      Storage__SecretKey: root-password

authentikCa:
  # Mounts the Authentik CA so the controller trusts ovea.pro TLS (OpenBao/OTel/auth).
  # pl install's minimal profile turns this off (no Authentik dependency).
  enabled: true
  fileName: auth-prod-ca.crt

slo:
  enabled: true
  labels:
    owner: "oliver"
    tier: "2"
  objectives:
    availability:
      target: 99.9
      description: "HTTP requests should not return 5xx errors."
    latency:
      target: 99
      threshold: "0.5"
      description: "HTTP requests should complete within 500ms."
