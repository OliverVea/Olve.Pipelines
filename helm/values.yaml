replicaCount: 1

image:
  repository: olve-pipelines
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

ingress:
  enabled: true
  host: pipelines-private.ovea.pro
  externalDnsTarget: "100.100.117.17"
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Auth__Authority: "https://auth.ovea.pro/application/o/olve-pipelines/"
  Auth__Audience: "olve-pipelines"
  OpenTelemetry__Endpoint: "https://otel.ovea.pro"
  OpenTelemetry__Protocol: "http"
  OpenTelemetry__OAuth2__TokenUrl: "https://auth.ovea.pro/application/o/token/"
  OpenTelemetry__OAuth2__ClientId: "otel"
  Storage__Endpoint: "https://minio.ovea.pro"
  Storage__Bucket: "olve-pipelines"
  Storage__AuthUrl: "https://auth.ovea.pro/application/o/token/"
  Kubernetes__OpenBaoUrl: "https://openbao.ovea.pro"
  Kubernetes__Namespace: "olve-runners"

secrets:
  - name: authentik-oidc-secrets
    envMap:
      OpenTelemetry__OAuth2__ClientSecret: otel-client-secret
  - name: olve-pipelines-oidc
    envMap:
      Storage__ClientId: client-id
      Storage__ClientSecret: client-secret
      Storage__RoleArn: role-arn

authentikCa:
  fileName: auth-prod-ca.crt

slo:
  enabled: true
  labels:
    owner: "oliver"
    tier: "2"
  objectives:
    availability:
      target: 99.9
      description: "HTTP requests should not return 5xx errors."
    latency:
      target: 99
      threshold: "0.5"
      description: "HTTP requests should complete within 500ms."
