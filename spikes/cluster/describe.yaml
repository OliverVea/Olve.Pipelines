# Spike 3: describe sandbox. ConfigMap carries the stand-in package.json + describe.ts + run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: spike-h-describe
  namespace: olve-runners-beta
  labels: { spike: v2-harness, app: olve-pipelines }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { spike: v2-harness, app: olve-pipelines, spike-case: describe }
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      volumes:
        - { name: spike, configMap: { name: spike-h-describe, defaultMode: 0755 } }
        - { name: work, emptyDir: { sizeLimit: 1Gi } }
      containers:
        - name: describe
          image: oven/bun:1-alpine
          command: ["/spike/run.sh"]
          env: [{ name: HOME, value: /work }, { name: BUN_INSTALL_CACHE_DIR, value: /work/.bun-cache }]
          volumeMounts: [{ name: spike, mountPath: /spike }, { name: work, mountPath: /work }]
          resources: { requests: { cpu: "1", memory: 256Mi }, limits: { memory: 1Gi } }
