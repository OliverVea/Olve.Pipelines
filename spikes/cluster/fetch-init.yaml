# Design B stand-in: stable loader image; init container HTTP-GETs the per-commit binary
# (gzipped tar, 44MB) and extracts into the emptyDir. Registry blob URL stands in for a
# Garage pre-signed GET URL. Then the step runs in distroless (no shell, no libc).
apiVersion: batch/v1
kind: Job
metadata:
  name: spike-h-fetch
  namespace: olve-runners-beta
  labels: { spike: v2-harness, app: olve-pipelines }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { spike: v2-harness, app: olve-pipelines, spike-case: fetch }
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      volumes: [{ name: olve, emptyDir: {} }]
      initContainers:
        - name: fetch
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              a=$(cut -d' ' -f1 /proc/uptime)
              wget -q -O - https://registry.ovea.pro/v2/olve-pipelines-v2/spike-harness-glibc/blobs/sha256:5b5e65311726261dc12b86dfbd393ff9923ca8ea543f7d311e140b1fc6b20987 | tar xz -C /shared
              b=$(cut -d' ' -f1 /proc/uptime); echo "FETCH+EXTRACT_SECONDS=$(awk "BEGIN{print $b-$a}")"; ls -la /shared/olve /shared/olve/lib
              mkdir -p /shared/olve/work /shared/olve/tmp; echo '{}' > /shared/olve/input.json
          volumeMounts: [{ name: olve, mountPath: /shared }]
      containers:
        - name: step
          image: gcr.io/distroless/static-debian12
          command: ["/olve/lib/ld-linux-x86-64.so.2", "--library-path", "/olve/lib", "/olve/step", "run", "fetched"]
          env: [{ name: TMPDIR, value: /olve/tmp }]
          volumeMounts: [{ name: olve, mountPath: /olve, subPath: olve }]
