---
apiVersion: batch/v1
kind: Job
metadata:
  name: spike-h-debian-glibc
  namespace: olve-runners-beta
  labels: { spike: v2-harness, app: olve-pipelines }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { spike: v2-harness, app: olve-pipelines, spike-case: "debian-glibc" }
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      volumes:
        - name: olve
          emptyDir: { sizeLimit: 512Mi }
      initContainers:
        - name: harness
          image: registry.ovea.pro/olve-pipelines-v2/spike-harness-glibc:2
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              a=$(cut -d' ' -f1 /proc/uptime); cp -a /olve/. /shared/; b=$(cut -d' ' -f1 /proc/uptime)
              mkdir -p /shared/work /shared/tmp; echo '{"case":"debian-glibc","libc":"glibc"}' > /shared/input.json
              echo "COPY_SECONDS=$(awk "BEGIN{print $b-$a}") SIZE=$(du -sh /shared | cut -f1)"
          volumeMounts: [{ name: olve, mountPath: /shared }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 512Mi } }
        - name: ldlist
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/olve/lib/ld-linux-x86-64.so.2", "--library-path", "/olve/lib", "--list", "/olve/step"]
          volumeMounts: [{ name: olve, mountPath: /olve }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 512Mi } }
        - name: cold
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/olve/lib/ld-linux-x86-64.so.2", "--library-path", "/olve/lib", "/olve/step", "run", "cold"]
          env: [{ name: TMPDIR, value: /olve/tmp }, { name: OLVE_OUTPUT, value: /olve/work/cold.json }]
          volumeMounts: [{ name: olve, mountPath: /olve }]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { memory: 512Mi } }
      containers:
        - name: step
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/olve/lib/ld-linux-x86-64.so.2", "--library-path", "/olve/lib", "/olve/step", "run", "debian-glibc"]
          env:
            - { name: TMPDIR, value: /olve/tmp }
            - { name: OLVE_FETCH, value: "https://registry.npmjs.org/zod,https://registry.ovea.pro/v2/,http://olve-pipelines-v2-garage.apps-beta.svc.cluster.local:3900/" }

          volumeMounts: [{ name: olve, mountPath: /olve }]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { memory: 512Mi } }
---
