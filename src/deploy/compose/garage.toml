# Local Garage config for docker-compose.yml. Same settings as helm/templates/garage-configmap.yaml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# us-east-1 so SigV4 clients that assume the AWS default region sign correctly (as in the chart).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
