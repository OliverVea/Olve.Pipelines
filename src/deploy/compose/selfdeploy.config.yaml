# Config document for Olve.Pipelines deploying itself into the local compose stack (docs/setup/self-hosting.md, "Watch it
# deploy itself"): one instance, no beta. deploy-prod asks the compose deployer (src/deploy/compose/deployer) to
# recreate the `pipelines` service, the instance running the pipeline, with the image the run built.
# Images go to the compose registry; nothing is published to npm or ghcr.
#
#   pl config set "Olve.Pipelines v2" -f src/deploy/compose/selfdeploy.config.yaml
#   printf local-registry | pl secret set "Olve.Pipelines v2" REGISTRY_PASSWORD
#   printf local-deployer | pl secret set "Olve.Pipelines v2" DEPLOYER_TOKEN
#
# src/deploy/compose/selfdeploy-incluster.config.yaml deploys to two k3s namespaces instead (tests the helm chart).

target:
  beta:
    kind: none
  prod:
    kind: compose
    deployerUrl: http://deployer:8080
    service: pipelines
    token: { secret: DEPLOYER_TOKEN }

auth:
  mode: none

telemetry:
  exporter: none

publish:
  server:
    repository: registry:5000/olve-pipelines
    insecure: true
    registryMap: {}
    auth:
      username: local
      password: { secret: REGISTRY_PASSWORD }
  harness:
    repository: registry:5000/olve-pipelines-harness-base
    insecure: true
    auth:
      username: local
      password: { secret: REGISTRY_PASSWORD }
  npm:
    enabled: false
  cli:
    enabled: true
