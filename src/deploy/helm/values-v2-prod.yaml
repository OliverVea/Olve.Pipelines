# Prod overlay, layered after values.yaml. Release olve-pipelines-v2 in apps; runners in
# olve-runners.
config:
  Storage__Endpoint: "http://olve-pipelines-v2-garage.apps:3900"
  # Host step pods dial for pre-signed URLs (signed into SigV4).
  Storage__InClusterEndpoint: "http://olve-pipelines-v2-garage.apps.svc.cluster.local:3900"
  Storage__Bucket: "olve-pipelines-v2"
  Kubernetes__Namespace: "olve-runners"
  # Step pods under gVisor (the RuntimeClass is the Olve.Homelab chart's).
  Kubernetes__RuntimeClassName: "gvisor"
  # Public webhook host (Cloudflare tunnel, routes only /api/webhooks/binding and /api/hooks).
  Webhooks__PublicBaseUrl: "https://pipelines-hooks.ovea.pro"
  Links__BaseUrl: "https://pipelines-private.ovea.pro"
  Telemetry__ServiceName: "olve-pipelines-v2"
  Distribution__CliPipeline: "Olve.Pipelines v2"
  # The pl release is built before beta; prod serves it once the run reaches promote.
  Distribution__CliPromotedBy: "promote"
  # Stage 2 of the self-deploy runs seven steps; 4 queued three of them.
  Jobs__MaxConcurrent: "8"
  # Deletes for real; the thresholds are the defaults (183 days and the latest 20), and the deployer
  # sets its own in .pipelines/pipeline.ts.
  Retention__DryRun: "false"

# --default-bucket creates this bucket and key (from the olve-pipelines-minio Secret) on first boot.
garage:
  enabled: true
  bucket: olve-pipelines-v2
  metaStorageClass: local-path
  dataStorage: 100Gi
  dataStorageClass: bulk

dex:
  enabled: true
  issuer: https://pipelines-private.ovea.pro/dex
  storageClass: local-path
