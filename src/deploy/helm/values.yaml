replicaCount: 1

image:
  repository: ghcr.io/olivervea/olve-pipelines
  tag: latest
  # Pins the image (repository:tag@digest); empty = by tag.
  digest: ""
  pullPolicy: IfNotPresent

# How users authenticate, mapped onto config.Auth__*. Empty = config.Auth__* as given.
#   mode: none                     # Auth__Disable=true: every endpoint is anonymous
#   mode: dex, issuer, clientId, frontendClientId?
#   mode: authentik, authority, audience, frontendAuthority, frontendAudience
# Required, here or as config.Auth__*: the chart refuses to render without auth.
auth: {}

# Telemetry export, mapped onto config.OpenTelemetry__*. Empty = config.OpenTelemetry__* as given.
#   exporter: none
#   exporter: otlp, endpoint, protocol?, headers?: { kubernetesSecret: { name, key } }
#     (headers: a Secret key holding "k1=v1,k2=v2", e.g. a backend's API key)
telemetry: {}

# The controller's ServiceAccount, with rights in the runner namespace (config.Kubernetes__Namespace).
serviceAccount:
  enabled: true

# The step pods' init image (src/harness/base), rendered as Harness__HarnessBaseImage. The deploy sets it
# from the publish-harness step's pushed image; empty = the server's built-in default.
harness:
  image:
    repository: ""
    tag: ""
    digest: ""

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

# Optional Ingresses for the instance (off: route to the Service however your cluster does).
# The private one serves the UI, API and /dex; the public one only the webhook receivers.
ingress:
  enabled: false
  host: ""
  externalDnsTarget: ""
  clusterIssuer: ""
  tls:
    enabled: true
    secretName: ""
  annotations: {}
  # Internet-facing, only the webhook receivers. With it, set config.Webhooks__PublicBaseUrl so
  # GitHub hooks are registered against this host.
  public:
    enabled: false
    host: ""
    externalDnsTarget: ""
    clusterIssuer: ""
    ingressClassName: ""
    tls:
      enabled: true
      secretName: ""
    annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    # 256Mi ran out (OutOfMemoryException, 502s, failed saves) when every binding resumed at
    # once after an expired GitHub token was replaced. Headroom, not a fix: memory grows with
    # job events until restart (#26).
    memory: 512Mi

# The instance's own Garage (S3-compatible, single node); the access key and bucket are created at
# startup from the credentials Secret (keys root-user, root-password, rpc-secret). Empty storage
# classes = the cluster default.
garage:
  enabled: true
  image: "dxflrs/garage:v2.4.1"
  credentialsSecret: olve-pipelines-minio
  bucket: olve-pipelines
  metaStorage: 5Gi
  metaStorageClass: ""
  dataStorage: 20Gi
  dataStorageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bundled Dex (OIDC with a GitHub upstream), served under /dex on the instance's host: the edge
# routes <host>/dex to the <release>-dex Service. GitHub app credentials come from githubSecret
# (keys github-client-id, github-client-secret).
dex:
  enabled: false
  image: "dexidp/dex:v2.43.1"
  issuer: ""
  clientId: olve-pipelines
  githubSecret: olve-pipelines-dex
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  # JSON log lines on stdout, for a node log collector to parse.
  Logging__Console__FormatterName: "json"
  Logging__Console__Json__UseUtcTimestamp: "true"
  # Unset: Storage__Endpoint/Bucket are the bundled Garage's, Kubernetes__Namespace (where step Jobs
  # run) is the release namespace. Kubernetes__RuntimeClassName runs step pods under e.g. gVisor;
  # Webhooks__PublicBaseUrl (the public origin GitHub posts to) turns on webhook registration.
  # The controller's ServiceAccount reaches the cluster API.
  Kubernetes__AuthMode: "InCluster"

secrets:
  # The Garage credentials (the Secret's name predates Garage).
  - name: olve-pipelines-minio
    envMap:
      Storage__AccessKey: root-user
      Storage__SecretKey: root-password

# A Sloth PrometheusServiceLevel (needs the Sloth CRD).
slo:
  enabled: false
  labels: {}
  objectives:
    availability:
      target: 99.9
      description: "HTTP requests should not return 5xx errors."
    latency:
      target: 99
      threshold: "0.5"
      description: "HTTP requests should complete within 500ms."

# More Kubernetes objects to deploy with the release, as YAML (e.g. a test companion of a beta).
extraObjects: []
