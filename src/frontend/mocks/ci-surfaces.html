<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI on the homepage and overview</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --blue-200: #496c89;
        --blue-300: #2a4f6e;
        --blue-400: #123552;
        --blue-500: #042037;
        --gold-200: #d4bc6a;
        --gold-300: #aa8f39;
        --gold-400: #806715;
        --coral-200: #d4856a;
        --coral-300: #aa5639;
        --color-bg: #f5f8fb;
        --color-surface: #ffffff;
        --color-surface-hover: #eef3f8;
        --color-border: #d3dde6;
        --color-text: var(--blue-500);
        --color-text-muted: var(--blue-200);
        --color-primary: var(--blue-300);
        --color-primary-hover: var(--blue-400);
        --color-danger: var(--coral-300);
        --color-success: #178351;
        --color-warning: var(--gold-400);
        --color-pending: var(--blue-200);
        --color-ask: #6a4bbf;
        --radius: 6px;
        --radius-lg: 10px;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --transition: 150ms ease;
        --shadow: 0 1px 3px rgba(4, 32, 55, 0.08), 0 1px 2px rgba(4, 32, 55, 0.04);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --color-bg: #0c1a28;
          --color-surface: #12253a;
          --color-surface-hover: #183049;
          --color-border: #26405a;
          --color-text: #dbe5ee;
          --color-text-muted: #8aa2b8;
          --color-primary: #8db3d6;
          --color-primary-hover: #b3cde6;
          --color-danger: var(--coral-200);
          --color-success: #4fbf8a;
          --color-warning: var(--gold-200);
          --color-pending: #6f8aa3;
          --color-ask: #b7a2f2;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
          color-scheme: dark;
        }
      }
      html {
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        color: var(--color-text);
        background: var(--color-bg);
      }
      body {
        margin: 0;
        padding: 1.5rem;
        max-width: 1320px;
        margin-inline: auto;
      }
      a {
        color: var(--color-primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .specimen {
        margin-bottom: 2.5rem;
      }
      .specimen > h4 {
        margin: 0 0 0.15rem;
        font-size: 0.95rem;
      }
      .specimen > p.note {
        margin: 0 0 0.75rem;
        font-size: 0.82rem;
        color: var(--color-text-muted);
      }
      .group {
        margin: 2rem 0 1rem;
        padding-bottom: 0.3rem;
        border-bottom: 2px solid var(--color-border);
        font-size: 1.1rem;
      }

      /* shared: status dot */
      .st {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--tone, var(--color-pending));
        border: 1.5px solid var(--tone, var(--color-pending));
      }
      .t-ok {
        --tone: var(--color-success);
      }
      .t-fail {
        --tone: var(--color-danger);
      }
      .t-run {
        --tone: var(--color-primary);
      }
      .t-idle {
        --tone: var(--color-pending);
      }
      .t-off {
        --tone: var(--color-text-muted);
      }
      .t-run .dot {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      /* pipeline-list-view (verbatim) */
      .rows {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 30rem), 1fr));
        gap: 0.75rem;
      }
      .pipeline-row {
        display: grid;
        grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) auto;
        grid-template-areas: 'status graph menu';
        align-items: center;
        gap: 1rem;
        padding: 0.6rem 0.5rem 0.6rem 1rem;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .pipeline-row:hover {
        border-color: var(--color-primary);
      }
      .pr-status {
        grid-area: status;
        min-width: 0;
      }
      .pr-graph {
        grid-area: graph;
        min-width: 0;
        display: flex;
        justify-content: center;
      }
      .pr-menu {
        grid-area: menu;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }
        .pipeline-row {
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-areas:
            'status menu'
            'graph graph';
          gap: 0.6rem 0.5rem;
          padding: 0.6rem 0.5rem 0.75rem 0.85rem;
        }
        .pr-menu {
          align-self: start;
        }
      }
      .pc-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        font-size: 1rem;
        color: var(--color-text);
      }
      .pc-repo {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin-top: 0.1rem;
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }
      .pc-repo svg {
        width: 0.85rem;
        height: 0.85rem;
      }
      .btn-delete {
        background: none;
        border: 1px solid var(--color-border);
        color: var(--color-text-muted);
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius);
        font-size: 0.8rem;
      }
      .star {
        color: var(--color-brand, #aa8f39);
        font-size: 1rem;
      }
      .cubes {
        display: flex;
        align-items: center;
        gap: 4px;
        width: max-content;
        max-width: 100%;
        padding: 3px;
        overflow-x: auto;
      }
      .cubes .col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cube {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--tone);
        border: 1.5px solid var(--tone);
      }
      .cube.never {
        --tone: var(--color-pending);
        background: transparent;
        border-style: dashed;
      }
      .cube.in-progress {
        animation: pulse 1.6s ease-in-out infinite;
      }
      .pc-foot {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.2rem 0.6rem;
        margin-top: 0.3rem;
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }
      .pc-foot .st {
        font-size: 0.78rem;
        color: var(--color-text);
      }
      .tag {
        font-size: 0.72rem;
        padding: 0 0.45rem;
        border-radius: 999px;
        border: 1px solid var(--color-border);
      }
      .tag.warn {
        color: var(--color-warning);
        border-color: color-mix(in srgb, var(--color-warning) 50%, transparent);
      }
      .tag.bad {
        color: var(--color-danger);
        border-color: color-mix(in srgb, var(--color-danger) 50%, transparent);
      }
      .tag.run {
        color: var(--color-primary);
        border-color: color-mix(in srgb, var(--color-primary) 50%, transparent);
      }

      /* pipeline-header status card (verbatim) */
      .status {
        display: flex;
        flex-wrap: wrap;
        margin-top: 0.75rem;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
        padding: 0.55rem 1rem;
      }
      .cell:not(:last-child) {
        border-right: 1px solid var(--color-border);
      }
      .cell.grow {
        flex: 1;
      }
      .label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-muted);
      }
      .value {
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--color-text);
        overflow-wrap: anywhere;
      }
      .value.st {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .sub {
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }
      .subject {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow-wrap: normal;
      }
      @media (max-width: 640px) {
        .cell {
          flex: 1 1 40%;
          padding: 0.5rem 0.75rem;
          border-bottom: 1px solid var(--color-border);
        }
        .cell:not(:last-child) {
          border-right: 0;
        }
        .cell.grow {
          flex-basis: 100%;
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <h3 class="group">Homepage: a pipeline card</h3>
    <div id="home"></div>

    <h3 class="group">Overview: the status card</h3>
    <div id="overview"></div>

    <script>
      const GH =
        '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.82 1.23.82.72 1.23 1.88.87 2.34.67.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';
      const stages = [1, 1, 7, 3, 2, 3, 2, 1];
      const cubes = `<div class="cubes">${stages
        .map(
          (n) => `<div class="col">${'<span class="cube t-ok"></span>'.repeat(n)}</div>`,
        )
        .join('')}</div>`;

      const card = (extra) => `<div class="rows"><div class="pipeline-row">
        <div class="pr-status">
          <a class="pc-title" href="#">Olve.Pipelines v2</a>
          <a class="pc-repo" href="#">${GH}<span>OliverVea/Olve.Pipelines</span></a>
          <div class="pc-foot">
            <span class="st t-ok"><span class="dot"></span>healthy</span>
            <span><a href="#">#812</a> succeeded 25 min ago</span>
            ${extra}
          </div>
        </div>
        <div class="pr-graph">${cubes}</div>
        <div class="pr-menu"><span class="star">★</span><button class="btn-delete">Delete</button></div>
      </div></div>`;

      const home = [
        ['1. Today', 'Unchanged, for comparison.', ''],
        [
          '2. Every open PR passes',
          'Nothing new: CI only speaks up when a PR needs you.',
          '',
        ],
        [
          '3. A PR fails',
          'New: a tag in the existing tag style, linking to the CI tab filtered to open PRs.',
          '<a class="tag bad" href="#">1 PR failing</a>',
        ],
        [
          '4. PRs running',
          'New: same as the CD “N running” tag.',
          '<span class="tag run">2 PRs running</span>',
        ],
      ];
      document.getElementById('home').innerHTML = home
        .map(
          ([t, n, x]) =>
            `<div class="specimen"><h4>${t}</h4><p class="note">${n}</p>${card(x)}</div>`,
        )
        .join('');

      const statusCard = (ci, today) => `<div class="status">
        <div class="cell"><span class="label">Version</span><a class="value" href="#">v214</a><span class="sub">active</span></div>
        <div class="cell"><span class="label">Last run</span><a class="value st t-ok" href="#"><span class="dot"></span>#812</a><span class="sub">succeeded · 25 min ago</span></div>
        <div class="cell"><span class="label">Critical path</span><a class="value" href="#">11m40s</a><span class="sub">median of 20 runs</span></div>
        ${today ? `<div class="cell"><span class="label">Failed for no reason</span><a class="value" href="#">1.5%</a><span class="sub">3 of 200 runs</span></div>` : ''}
        ${ci}
        ${
          today
            ? `<div class="cell grow"><span class="label">Newest commit</span><a class="value subject" href="#">docs(agents): the publishing policy: what agents land themselves</a><span class="sub"><span class="mono">b00f62a</span> · 25 min ago</span></div>
        <div class="cell grow"><span class="label">Source</span><a class="value mono" href="#">OliverVea/Olve.Pipelines@main</a><span class="sub">synced <span class="mono">b00f62a</span> · 24 min ago</span></div>`
            : ''
        }
      </div>`;

      const ciCell = (tone, value, sub) =>
        `<div class="cell"><span class="label">Pull requests</span><a class="value st t-${tone}" href="#"><span class="dot"></span>${value}</a><span class="sub">${sub}</span></div>`;

      const overview = [
        ['1. Today', 'Unchanged, for comparison.', '', true],
        [
          '2. Open PRs, all passing',
          'New: Failed for no reason, Newest commit and Source are gone (the binding tab has the source); a “Pull requests” cell links to the CI tab.',
          ciCell('ok', '5 open', 'all passing'),
        ],
        [
          '3. A PR fails, others running',
          'New: the cell takes the worst status of the open PRs.',
          ciCell('fail', '5 open', '1 failing · 2 running'),
        ],
        [
          '4. A PR fails, CD runs active',
          'The existing Active cell comes before it.',
          `<div class="cell"><span class="label">Active</span><a class="value" href="#">2 running</a><span class="sub">0 held</span></div>` +
            ciCell('fail', '5 open', '1 failing · 2 running'),
        ],
        ['5. No open PRs', 'The cell is left out, like Active when nothing runs.', ''],
      ];
      document.getElementById('overview').innerHTML = overview
        .map(
          ([t, n, x, today]) =>
            `<div class="specimen"><h4>${t}</h4><p class="note">${n}</p>${statusCard(x, today)}</div>`,
        )
        .join('');
    </script>
  </body>
</html>
