<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI mock</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --blue-200: #496c89;
        --blue-300: #2a4f6e;
        --blue-400: #123552;
        --blue-500: #042037;
        --gold-200: #d4bc6a;
        --gold-300: #aa8f39;
        --gold-400: #806715;
        --coral-100: #ffc0aa;
        --coral-200: #d4856a;
        --coral-300: #aa5639;
        --coral-400: #803015;
        --color-bg: #f5f8fb;
        --color-surface: #ffffff;
        --color-surface-hover: #eef3f8;
        --color-border: #d3dde6;
        --color-text: var(--blue-500);
        --color-text-muted: var(--blue-200);
        --color-primary: var(--blue-300);
        --color-primary-hover: var(--blue-400);
        --color-danger: var(--coral-300);
        --color-success: #178351;
        --color-warning: var(--gold-400);
        --color-pending: var(--blue-200);
        --color-ask: #6a4bbf;
        --color-code-bg: #eef3f8;
        --color-brand: var(--gold-300);
        --radius: 6px;
        --radius-lg: 10px;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --transition: 150ms ease;
        --shadow: 0 1px 3px rgba(4, 32, 55, 0.08), 0 1px 2px rgba(4, 32, 55, 0.04);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --color-bg: #0c1a28;
          --color-surface: #12253a;
          --color-surface-hover: #183049;
          --color-border: #26405a;
          --color-text: #dbe5ee;
          --color-text-muted: #8aa2b8;
          --color-primary: #8db3d6;
          --color-primary-hover: #b3cde6;
          --color-danger: var(--coral-200);
          --color-success: #4fbf8a;
          --color-warning: var(--gold-200);
          --color-pending: #6f8aa3;
          --color-ask: #b7a2f2;
          --color-code-bg: #0f2033;
          --color-brand: var(--gold-200);
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
          color-scheme: dark;
        }
      }
      html {
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        color: var(--color-text);
        background: var(--color-bg);
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
      }
      a {
        color: var(--color-primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code,
      .mono {
        font-family: var(--font-mono);
        font-size: 0.86em;
      }
      .muted {
        color: var(--color-text-muted);
      }
      button {
        cursor: pointer;
        font-family: inherit;
        font-size: inherit;
      }

      /* app-shell */
      .shell {
        max-width: 1320px;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 5rem;
      }
      .shell > header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--color-border);
      }
      .shell > header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .shell > header h1 a {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--color-text);
      }
      .shell > header svg {
        width: 20px;
        height: 20px;
      }
      .user-info {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }
      .user-info .user-name {
        color: var(--color-text);
      }
      .spacer {
        flex: 1;
      }

      /* sharedStyles */
      h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      h3 {
        margin: 0 0 0.6rem;
        font-size: 0.95rem;
        font-weight: 650;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.7rem;
        border-radius: var(--radius);
        border: 1px solid var(--color-border);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 0.82rem;
        line-height: 1.4;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--color-surface-hover);
        border-color: var(--color-primary);
        text-decoration: none;
      }
      .btn.danger:hover {
        border-color: var(--color-danger);
        color: var(--color-danger);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.05rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        border: 1px solid var(--color-border);
        color: var(--color-text-muted);
        background: var(--color-surface);
        white-space: nowrap;
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--tone, var(--color-pending));
        border: 1.5px solid var(--tone, var(--color-pending));
      }
      .t-ok {
        --tone: var(--color-success);
      }
      .t-fail {
        --tone: var(--color-danger);
      }
      .t-run {
        --tone: var(--color-primary);
      }
      .t-wait {
        --tone: var(--color-warning);
      }
      .t-idle {
        --tone: var(--color-pending);
      }
      .t-off {
        --tone: var(--color-text-muted);
      }
      .t-idle .dot,
      .dot.t-idle {
        background: transparent;
        border-style: dashed;
      }
      .t-off .dot,
      .dot.t-off {
        background: transparent;
      }
      .t-run .dot,
      .dot.t-run {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid var(--color-border);
        vertical-align: middle;
      }
      th {
        color: var(--color-text-muted);
        font-weight: 500;
        font-size: 0.78rem;
      }
      tbody tr:hover {
        background: var(--color-surface-hover);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .table-wrap {
        overflow-x: auto;
      }
      section + section {
        margin-top: 1.5rem;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--color-surface);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--color-text);
        padding: 0.2rem 0.6rem;
        font-size: 0.76rem;
      }
      .seg button + button {
        border-left: 1px solid var(--color-border);
      }
      .seg button[aria-pressed='true'] {
        background: var(--color-primary);
        color: var(--color-surface);
      }
      .crumbs {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.85rem;
        color: var(--color-text-muted);
        margin-bottom: 0.4rem;
      }
      .crumbs a {
        color: var(--color-text-muted);
      }
      .error {
        color: var(--color-danger);
      }

      /* headerStyles + tabs + status card */
      .line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.3rem 0.75rem;
      }
      .line h2 {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .line .spacer {
        flex: 1;
      }
      .crumb {
        color: var(--color-text-muted);
        font-weight: 500;
      }
      .sep {
        margin: 0 0.35rem;
        color: var(--color-text-muted);
        font-weight: 400;
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
        margin-top: 0.9rem;
        border-bottom: 1px solid var(--color-border);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs a {
        flex: none;
        padding: 0.45rem 0.7rem;
        margin-bottom: -1px;
        border-bottom: 2px solid transparent;
        color: var(--color-text-muted);
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
      }
      .tabs a:hover {
        color: var(--color-text);
        border-bottom-color: var(--color-border);
      }
      .tabs a[aria-current='page'] {
        color: var(--color-text);
        border-bottom-color: var(--color-primary);
      }
      .status {
        display: flex;
        flex-wrap: wrap;
        margin-top: 0.75rem;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
        padding: 0.55rem 1rem;
      }
      .cell:not(:last-child) {
        border-right: 1px solid var(--color-border);
      }
      .cell.grow {
        flex: 1;
      }
      .label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-muted);
      }
      .value {
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--color-text);
        overflow-wrap: anywhere;
      }
      a.value:hover {
        color: var(--color-primary);
      }
      .sub {
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }

      /* stage graph (tiles) */
      .scroller {
        overflow-x: auto;
        padding: 0.9rem 0 0.4rem;
      }
      .row {
        display: flex;
        align-items: stretch;
        width: max-content;
        margin-inline: auto;
      }
      .col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.5rem;
      }
      .barrier {
        position: relative;
        width: 1.5rem;
        flex-shrink: 0;
      }
      .barrier::after {
        content: '';
        position: absolute;
        left: calc(50% - 4px);
        top: calc(50% - 4px);
        width: 7px;
        height: 7px;
        border-top: 1.5px solid var(--color-text-muted);
        border-right: 1.5px solid var(--color-text-muted);
        transform: rotate(45deg);
      }
      .tile {
        position: relative;
        width: 15.5rem;
        padding: 0.5rem 0.65rem;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-left: 3px solid var(--tone, var(--color-border));
        border-radius: var(--radius);
        cursor: pointer;
      }
      .tile:hover {
        border-color: var(--color-primary);
        border-left-color: var(--tone, var(--color-primary));
      }
      .head {
        display: flex;
        align-items: flex-start;
        gap: 0.4rem;
      }
      .name {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 0.88rem;
        overflow-wrap: anywhere;
      }
      .badge {
        font-size: 0.66rem;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        white-space: nowrap;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 15%, transparent);
      }
      .t-idle .badge,
      .t-off .badge {
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--tone) 45%, transparent);
      }
      .t-run .badge {
        animation: pulse 1.6s ease-in-out infinite;
      }
      .meta {
        margin-top: 0.3rem;
        min-height: 1.15rem;
        display: flex;
        gap: 0.35rem;
        font-size: 0.74rem;
        color: var(--color-text-muted);
        white-space: nowrap;
      }
      .meta > * + *::before {
        content: '·';
        margin-right: 0.35rem;
      }
      .reason {
        margin-top: 0.2rem;
        overflow-wrap: anywhere;
        font-size: 0.72rem;
        color: var(--color-text-muted);
      }

      /* ===== new: CI ===== */
      .scroller + section {
        margin-top: 1.25rem;
      }
      .change {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .change .title {
        color: var(--color-text);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 34rem;
      }
      .change .branch {
        font-family: var(--font-mono);
        font-size: 0.74rem;
        color: var(--color-text-muted);
      }
      .steps-strip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .steps-strip .gap {
        width: 6px;
      }
      .steps-strip .dot {
        width: 0.5rem;
        height: 0.5rem;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1rem 0 0.6rem;
      }
      td.pr {
        white-space: nowrap;
        font-weight: 650;
      }
      .why {
        color: var(--color-text-muted);
        font-size: 0.8rem;
      }
      @media (max-width: 640px) {
        .shell {
          padding: 1rem 1rem 5rem;
        }
        .shell > header {
          margin-bottom: 1.25rem;
        }
        .hide-phone {
          display: none;
        }
        .change .title {
          max-width: 13rem;
        }
        .cell {
          flex: 1 1 40%;
          padding: 0.5rem 0.75rem;
          border-bottom: 1px solid var(--color-border);
        }
        .cell:not(:last-child) {
          border-right: 0;
        }
        .cell.grow {
          flex-basis: 100%;
        }
        .row {
          flex-direction: column;
          width: 100%;
        }
        .col {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }
        .barrier {
          width: 100%;
          height: 1.4rem;
        }
        .barrier::after {
          transform: rotate(135deg);
          top: calc(50% - 6px);
        }
        .tile {
          width: 100%;
        }
      }

      /* mock-only switcher */
      .mockbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 0.5rem;
        justify-content: center;
        padding: 0.45rem 0.75rem;
        background: #2b2b2b;
        color: #eee;
        font-size: 0.75rem;
        z-index: 10;
      }
      .mockbar a {
        color: #ffd27a;
      }
      .mockbar a.on {
        color: #fff;
        font-weight: 700;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>
          <a href="#list"
            ><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2">
              <rect
                x="2"
                y="9"
                width="6"
                height="6"
                rx="1.2"
                fill="var(--color-primary)"
                stroke="var(--color-primary)"
              />
              <rect
                x="16"
                y="9"
                width="6"
                height="6"
                rx="1.2"
                stroke="var(--color-brand)"
              />
              <path d="M8 12h8" stroke="var(--color-text-muted)" /></svg
            >Olve Pipelines</a
          >
        </h1>
        <span class="spacer"></span>
        <div class="user-info">
          <span class="user-name">OliverVea</span><button class="btn">Log out</button>
        </div>
      </header>
      <main id="app"></main>
    </div>
    <nav class="mockbar" id="mockbar"></nav>

    <script>
      const P = 'Olve.Pipelines v2';
      const steps = [
        ['source'],
        ['spec'],
        ['compile-server', 'build-frontend', 'build-harness', 'build-sdk', 'check-cli'],
        ['test', 'check'],
      ];
      const flat = steps.flat();
      const TONE = {
        succeeded: 'ok',
        failed: 'fail',
        running: 'run',
        scheduled: 'run',
        cancelled: 'off',
        superseded: 'off',
        'not run': 'idle',
        skipped: 'off',
      };

      // step status per run: [status, duration, reason?]
      const S = (s, d, r) => ({ s, d, r });
      const done = (o = {}) =>
        Object.fromEntries(
          flat.map((n, i) => [
            n,
            o[n] ??
              S(
                'succeeded',
                ['8s', '21s', '1m52s', '52s', '18s', '1m04s', '24s', '3m10s', '1m41s'][i],
              ),
          ]),
        );
      const runningSteps = done({
        'compile-server': S('running', '1m40s'),
        'build-sdk': S('running', '58s'),
        test: S('not run'),
        check: S('not run'),
      });
      const failedSteps = done({
        test: S(
          'failed',
          '2m47s',
          '3 of 1,284 tests failed: BindingPathTests.Moved_path_reconciles_once, …',
        ),
      });
      const cancelledSteps = done({
        'compile-server': S('cancelled', '1m12s'),
        'build-sdk': S('cancelled', '40s'),
        test: S('not run'),
        check: S('not run'),
      });
      const scheduledSteps = Object.fromEntries(
        flat.map((n, i) => [n, i === 0 ? S('scheduled', '') : S('not run')]),
      );

      const runs = {
        57: {
          pr: 148,
          sha: 'a1b2c3d',
          msg: 'feat(runs): a matrix cell reruns on its own',
          status: 'running',
          started: '2 min ago',
          dur: '2m14s',
          steps: runningSteps,
        },
        56: {
          pr: 148,
          sha: '9f8e7d6',
          msg: 'feat(runs): matrix cells rerun',
          status: 'superseded',
          by: 57,
          started: '9 min ago',
          dur: '3m02s',
          steps: cancelledSteps,
        },
        51: {
          pr: 148,
          sha: '3c4d5e6',
          msg: 'wip: matrix rerun',
          status: 'failed',
          started: '1 h ago',
          dur: '6m31s',
          steps: failedSteps,
        },
        58: {
          pr: 149,
          sha: '77aa01f',
          msg: 'fix(ui): the stage graph keeps its scroll on refresh',
          status: 'scheduled',
          started: 'just now',
          dur: '4s',
          steps: scheduledSteps,
        },
        55: {
          pr: 147,
          sha: 'e4f5a6b',
          msg: 'fix(sync): reconcile a binding whose path moved',
          status: 'failed',
          started: '14 min ago',
          dur: '6m12s',
          steps: failedSteps,
        },
        54: {
          pr: 145,
          sha: 'c0ffee1',
          msg: 'docs(design): CI runs per pull request',
          status: 'succeeded',
          started: '1 h ago',
          dur: '5m48s',
          steps: done(),
        },
        53: {
          pr: 144,
          sha: 'b16b00b',
          msg: 'chore(deps): bump zod to 4.3.2',
          status: 'succeeded',
          started: '3 h ago',
          dur: '5m55s',
          steps: done(),
        },
        52: {
          pr: 146,
          sha: 'd00dfee',
          msg: 'feat(cli): pl wait accepts a branch',
          status: 'cancelled',
          why: 'merged',
          started: '40 min ago',
          dur: '2m50s',
          steps: cancelledSteps,
        },
        49: {
          pr: 143,
          sha: '1234abc',
          msg: 'spike: run steps under kata',
          status: 'cancelled',
          why: 'closed',
          started: '1 d ago',
          dur: '1m20s',
          steps: cancelledSteps,
        },
        47: {
          pr: 141,
          sha: 'abc9876',
          msg: 'feat(ui): reliability per step',
          status: 'succeeded',
          started: '2 d ago',
          dur: '5m41s',
          steps: done(),
        },
        50: {
          branch: 'OliverVea/gvisor-probe',
          sha: '5e5e5e5',
          msg: 'test: probe runsc syscalls',
          status: 'failed',
          started: '5 h ago',
          dur: '4m02s',
          steps: failedSteps,
        },
        48: {
          branch: 'OliverVea/garage-bench',
          sha: '8b8b8b8',
          msg: 'bench: garage put throughput',
          status: 'succeeded',
          started: '1 d ago',
          dur: '5m39s',
          steps: done(),
        },
      };
      const prs = {
        149: {
          title: 'fix(ui): the stage graph keeps its scroll on refresh',
          branch: 'OliverVea/graph-scroll',
          state: 'open',
          runs: [58],
        },
        148: {
          title: 'feat(runs): a matrix cell reruns on its own',
          branch: 'OliverVea/matrix-retry',
          state: 'open',
          runs: [57, 56, 51],
        },
        147: {
          title: 'fix(sync): reconcile a binding whose path moved',
          branch: 'OliverVea/binding-path',
          state: 'open',
          runs: [55],
        },
        145: {
          title: 'docs(design): CI runs per pull request',
          branch: 'OliverVea/ci',
          state: 'open',
          runs: [54],
        },
        144: {
          title: 'chore(deps): bump zod to 4.3.2',
          branch: 'renovate/zod-4.x',
          state: 'open',
          runs: [53],
        },
        146: {
          title: 'feat(cli): pl wait accepts a branch',
          branch: 'OliverVea/wait-branch',
          state: 'merged',
          runs: [52],
        },
        143: {
          title: 'spike: run steps under kata',
          branch: 'OliverVea/kata',
          state: 'closed',
          runs: [49],
        },
        141: {
          title: 'feat(ui): reliability per step',
          branch: 'OliverVea/reliability',
          state: 'merged',
          runs: [47],
        },
      };
      const branches = { 'OliverVea/gvisor-probe': [50], 'OliverVea/garage-bench': [48] };

      const st = (s) =>
        `<span class="st t-${TONE[s]}"><span class="dot"></span>${s}</span>`;
      const gh = 'https://github.com/OliverVea/Olve.Pipelines';
      const strip = (r) =>
        `<span class="steps-strip" aria-label="steps">${steps
          .map((stage) =>
            stage
              .map(
                (n) =>
                  `<span class="dot t-${TONE[r.steps[n].s]}" title="${n}: ${r.steps[n].s}"></span>`,
              )
              .join(''),
          )
          .join('<span class="gap"></span>')}</span>`;
      const why = (r) =>
        r.by
          ? `superseded by <a href="#run-${r.by}">#${r.by}</a>`
          : r.why
            ? `pull request ${r.why}`
            : '';

      function header(tab) {
        const tabs = [
          'Overview',
          'Runs',
          'CI',
          'Versions',
          'Config',
          'Secrets',
          'Binding',
        ];
        return `<div class="line"><h2>${P}</h2>${st('succeeded').replace('succeeded', 'healthy')}<span class="spacer"></span></div>
          <nav class="tabs">${tabs.map((t) => `<a href="#${t === 'CI' ? 'list' : ''}" aria-current="${t === tab ? 'page' : 'false'}">${t}</a>`).join('')}</nav>`;
      }

      function list(filter, mode) {
        const seg = ['open', 'closed', 'branches']
          .map(
            (f) =>
              `<button aria-pressed="${f === filter}" onclick="go('${f === 'open' ? 'list' : f}')">${{ open: 'Open', closed: 'Closed', branches: 'Branches' }[f]}</button>`,
          )
          .join('');
        let body;
        if (mode === 'loading') body = `<p class="muted">Loading…</p>`;
        else if (mode === 'error')
          body = `<p class="error">Could not load CI runs: 503 Service Unavailable.</p>`;
        else if (mode === 'empty') body = `<p class="muted">No open pull requests.</p>`;
        else if (filter === 'branches')
          body = table(
            Object.entries(branches).map(([b, rs]) => row(null, b, null, rs)),
            true,
          );
        else {
          const want = filter === 'open' ? ['open'] : ['merged', 'closed'];
          body = table(
            Object.entries(prs)
              .filter(([, p]) => want.includes(p.state))
              .sort(([a], [b]) => b - a)
              .map(([n, p]) => row(n, p.branch, p, p.runs)),
            false,
            filter === 'closed',
          );
        }
        return `${header('CI')}<div class="toolbar"><div class="seg">${seg}</div></div>${body}`;
      }

      function table(rows, isBranch, closed) {
        return `<section class="table-wrap"><table>
          <thead><tr>
            <th>${isBranch ? 'Branch' : 'Pull request'}</th><th>Status</th><th class="hide-phone">Steps</th>
            <th class="hide-phone">Commit</th><th>Run</th><th class="hide-phone">Started</th><th class="num hide-phone">Duration</th>
            ${closed ? '<th class="hide-phone"></th>' : ''}
          </tr></thead><tbody>${rows.join('')}</tbody></table></section>`;
      }

      function row(n, branch, p, rs) {
        const r = runs[rs[0]];
        const change = p
          ? `<div class="change"><a class="title" href="#run-${rs[0]}">${p.title}</a><span class="branch">#${n} · ${branch}</span></div>`
          : `<div class="change"><a class="title mono" href="#run-${rs[0]}">${branch}</a></div>`;
        return `<tr>
          <td>${change}</td>
          <td>${st(r.status)}</td>
          <td class="hide-phone">${strip(r)}</td>
          <td class="hide-phone mono"><a href="${gh}/commit/${r.sha}" target="_blank">${r.sha}</a></td>
          <td class="num"><a href="#run-${rs[0]}"><b>#${rs[0]}</b></a></td>
          <td class="hide-phone">${r.started}</td>
          <td class="num hide-phone">${r.dur}</td>
          ${p && p.state !== 'open' ? `<td class="hide-phone"><span class="pill">${p.state}</span></td>` : ''}
        </tr>`;
      }

      function graph(r) {
        return `<div class="scroller"><div class="row">${steps
          .map(
            (stage, i) =>
              `${i ? '<div class="barrier" aria-hidden="true"></div>' : ''}<div class="col">${stage
                .map((n) => {
                  const x = r.steps[n];
                  return `<div class="tile t-${TONE[x.s]}"><div class="head"><span class="name">${n}</span>${x.s === 'not run' ? '' : `<span class="badge">${x.s}</span>`}</div>
                    <div class="meta">${x.s === 'not run' ? '<span>not run</span>' : x.d ? `<span>${x.d}</span>` : ''}</div>
                    ${x.r ? `<div class="reason">${x.r}</div>` : ''}</div>`;
                })
                .join('')}</div>`,
          )
          .join('')}</div></div>`;
      }

      function runView(num) {
        const r = runs[num];
        const p = r.pr ? prs[r.pr] : null;
        const live = r.status === 'running' || r.status === 'scheduled';
        const history = p ? p.runs : branches[r.branch];
        const name = p ? `#${r.pr}` : r.branch;
        return `
          <div class="crumbs"><a href="#">${P}</a><span>/</span><a href="#list">CI</a><span>/</span><span>${name}</span></div>
          <div class="line">
            <h2><span class="crumb">${p ? `#${r.pr}` : `<span class="mono">${r.branch}</span>`}</span><span class="sep">/</span>Run #${num}</h2>
            ${st(r.status)}
            ${why(r) ? `<span class="why">${why(r)}</span>` : ''}
            <span class="spacer"></span>
            ${live ? '<button class="btn danger">Cancel</button>' : ''}
            <button class="btn">Rerun</button>
          </div>
          <div class="status">
            <div class="cell grow"><span class="label">${p ? 'Pull request' : 'Branch'}</span>
              ${
                p
                  ? `<a class="value" href="${gh}/pull/${r.pr}" target="_blank">${p.title}</a><span class="sub mono">${p.branch} → main</span>`
                  : `<span class="value mono">${r.branch}</span><span class="sub">no pull request</span>`
              }
            </div>
            <div class="cell"><span class="label">Commit</span><a class="value mono" href="${gh}/commit/${r.sha}" target="_blank">${r.sha}</a><span class="sub">${r.msg}</span></div>
            <div class="cell"><span class="label">GitHub check</span><span class="value">${st({ running: 'running', scheduled: 'scheduled', succeeded: 'succeeded', failed: 'failed', cancelled: 'cancelled', superseded: 'superseded' }[r.status])}</span><span class="sub mono">olve/ci</span></div>
            <div class="cell"><span class="label">Started</span><span class="value">${r.started}</span><span class="sub">${r.dur}</span></div>
          </div>
          ${graph(r)}
          <section>
            <h3>Runs of ${p ? `pull request #${r.pr}` : r.branch}</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Run</th><th>Status</th><th>Commit</th><th class="hide-phone">Steps</th><th class="hide-phone">Started</th><th class="num hide-phone">Duration</th><th></th></tr></thead>
              <tbody>${history
                .map((n) => {
                  const h = runs[n];
                  return `<tr><td><a href="#run-${n}"><b>#${n}</b></a></td><td>${st(h.status)}</td>
                    <td><span class="mono"><a href="${gh}/commit/${h.sha}" target="_blank">${h.sha}</a></span> <span class="muted hide-phone">${h.msg}</span></td>
                    <td class="hide-phone">${strip(h)}</td><td class="hide-phone">${h.started}</td><td class="num hide-phone">${h.dur}</td><td class="why">${why(h)}</td></tr>`;
                })
                .join('')}</tbody></table></div>
          </section>`;
      }

      const states = [
        ['list', 'CI: open PRs'],
        ['closed', 'closed PRs'],
        ['branches', 'branches'],
        ['empty', 'empty'],
        ['loading', 'loading'],
        ['error', 'error'],
        ['run-57', 'run: running'],
        ['run-58', 'run: scheduled'],
        ['run-55', 'run: failed'],
        ['run-56', 'run: superseded'],
        ['run-52', 'run: cancelled (merged)'],
        ['run-50', 'run: branch'],
      ];
      function go(h) {
        location.hash = h;
      }
      function render() {
        const h = location.hash.slice(1) || 'list';
        const app = document.getElementById('app');
        if (h.startsWith('run-')) app.innerHTML = runView(+h.slice(4));
        else if (['empty', 'loading', 'error'].includes(h))
          app.innerHTML = list('open', h);
        else app.innerHTML = list(h === 'list' ? 'open' : h);
        document.getElementById('mockbar').innerHTML =
          '<b>Mock</b>' +
          states
            .map(([k, l]) => `<a href="#${k}" class="${k === h ? 'on' : ''}">${l}</a>`)
            .join('');
      }
      addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
