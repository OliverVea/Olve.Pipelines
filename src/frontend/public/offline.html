<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1a28" media="(prefers-color-scheme: dark)" />
    <title>Can't reach Olve Pipelines</title>
    <!-- Shown by sw.js when opening a page fails for want of a connection: self-contained, since
         nothing else can load then. -->
    <style>
      :root {
        --bg: #f5f8fb;
        --ink: #042037;
        --ink-muted: #496c89;
        --primary: #2a4f6e;
        --on-primary: #ffffff;
        --brand: #aa8f39;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1a28;
          --ink: #dbe5ee;
          --ink-muted: #8aa2b8;
          --primary: #8db3d6;
          --on-primary: #0c1a28;
          --brand: #d4bc6a;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px
          max(16px, env(safe-area-inset-left, 0px));
      }
      .card {
        width: min(380px, 100%);
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }
      svg {
        width: 48px;
        height: 48px;
        margin-bottom: 4px;
      }
      h1 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--ink-muted);
        max-width: 34ch;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 1.4rem;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        min-height: 1.5em;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <g fill="currentColor" opacity="0.35">
            <rect x="1" y="7" width="6" height="6" rx="1.5" />
            <rect x="13" y="1" width="6" height="6" rx="1.5" />
          </g>
          <path
            d="M7 10h3M13 4h-1.25A1.75 1.75 0 0 0 10 5.75v8.5A1.75 1.75 0 0 0 11.75 16H13"
            fill="none"
            stroke="currentColor"
            stroke-opacity="0.35"
            stroke-width="1.5"
          />
          <rect
            x="13.75"
            y="13.75"
            width="4.5"
            height="4.5"
            rx="1.25"
            fill="none"
            stroke="var(--brand)"
            stroke-width="1.5"
          />
        </svg>
        <h1>Can't reach Olve Pipelines</h1>
        <p>The connection failed. Check your connection, then try again.</p>
        <button type="button" id="retry">Try again</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </main>
    <script>
      // Check the server answers before reloading, so a failure says so here instead of
      // reloading into this page again.
      const retry = document.getElementById('retry');
      const status = document.getElementById('status');
      retry.addEventListener('click', async () => {
        retry.disabled = true;
        status.textContent = 'Trying…';
        try {
          const response = await fetch('/', { method: 'HEAD', cache: 'no-store' });
          if (!response.ok) throw new Error(String(response.status));
          location.reload();
        } catch {
          retry.disabled = false;
          status.textContent = 'Still no connection.';
        }
      });
    </script>
  </body>
</html>
