# Generated output goes to the repo's artifacts/ (gitignored), never into source folders.
output-dir: "{project-root}/../../artifacts"
emit:
  - "@typespec/openapi3"
  - "@olivervea/typespec-csharp"
options:
  "@typespec/openapi3":
    # 3.0: TypeSpec writes a `Record<T>` as `additionalProperties` there, which Hey API types; 3.1 and
    # 3.2 get `unevaluatedProperties`, which it doesn't.
    openapi-versions: ["3.0.0"]
    file-type: json
    emitter-output-dir: "{output-dir}/spec"
  # The server's C# surface (runtime: Olve.TypeSpec), compiled into src/backend/Olve.Pipelines by its csproj.
  "@olivervea/typespec-csharp":
    emitter-output-dir: "{output-dir}/generated/backend"
    namespace: "Olve.Pipelines.Api"
    external-types:
      ApiProblem: "Olve.Pipelines.Shared.Problems.ApiProblem"
      ApiProblemError: "Olve.Pipelines.Shared.Problems.ApiProblemError"
      ApiProblemCode: "Olve.Pipelines.Shared.Problems.ApiProblemCode"
